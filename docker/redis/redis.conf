bind 0.0.0.0
# Redis is exposed to sibling services on the private Compose backend network.
# The host mapping remains loopback-only in docker-compose.yml.
protected-mode no
port 6379
dir /data
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 10
save 60 10000
maxmemory-policy noeviction
timeout 0
tcp-keepalive 60
