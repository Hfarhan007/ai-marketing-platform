name: Container build
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  build-scan-sign:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api, dockerfile: docker/api/Dockerfile.production }
          - { service: worker, dockerfile: docker/worker/Dockerfile.production }
          - { service: web, dockerfile: docker/web/Dockerfile.production }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          {
            image: '${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}',
            artifact-name: '${{ matrix.service }}-sbom.spdx.json',
            format: spdx-json,
          }
      - name: Scan immutable image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          {
            image-ref: '${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}',
            format: sarif,
            output: trivy.sarif,
            severity: HIGH,
            CRITICAL,
            exit-code: '1',
          }
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy.sarif, category: 'container-${{ matrix.service }}' }
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Keyless sign immutable image
        env: { IMAGE: '${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}' }
        run: cosign sign --yes "$IMAGE"
      - uses: actions/attest-build-provenance@v2
        with:
          {
            subject-name: '${{ steps.image.outputs.name }}',
            subject-digest: '${{ steps.build.outputs.digest }}',
            push-to-registry: true,
          }
