name: Container scan
on:
  workflow_dispatch:
    inputs:
      image:
        {
          description: 'Full immutable GHCR image reference including digest',
          required: true,
          type: string,
        }
permissions: { contents: read, packages: read, security-events: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Require digest-pinned image
        env: { IMAGE: '${{ inputs.image }}' }
        run: '[[ "$IMAGE" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]] || exit 1'
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          {
            image-ref: '${{ inputs.image }}',
            format: sarif,
            output: trivy.sarif,
            severity: HIGH,
            CRITICAL,
            exit-code: '1',
          }
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy.sarif, category: manual-container-scan }
