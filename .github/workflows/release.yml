name: Release
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Semantic version without v prefix', required: true, type: string }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release-approval
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate release version
        env: { VERSION: '${{ inputs.version }}' }
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || exit 1; git rev-parse "v$VERSION" >/dev/null 2>&1 && { echo "Tag already exists"; exit 1; } || true'
      - run: pnpm lint && pnpm type-check && pnpm test && pnpm build
      - name: Create immutable release tag and GitHub release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', VERSION: '${{ inputs.version }}' }
        run: |
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --generate-notes --verify-tag --title "v$VERSION"
