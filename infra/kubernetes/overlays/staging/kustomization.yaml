apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: amp-staging
resources: [../../base]
patches:
  - target: { kind: Namespace, name: amp }
    patch: |-
      - op: replace
        path: /metadata/name
        value: amp-staging
configMapGenerator:
  - name: amp-environment
    literals: [ENVIRONMENT=staging]
