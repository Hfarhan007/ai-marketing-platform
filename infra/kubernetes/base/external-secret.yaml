apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: amp-runtime-secrets, namespace: amp }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: platform-secrets }
  target: { name: amp-runtime-secrets, creationPolicy: Owner }
  dataFrom: [{ extract: { key: amp/runtime } }]
