apiVersion: v1
kind: ServiceAccount
metadata: { name: {{ .Values.serviceAccountName }} }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: amp-worker }
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: amp-worker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: amp-worker } }
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 256Mi } }]
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: health, containerPort: 3002 }]
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          envFrom: [{ configMapRef: { name: {{ .Values.configMapName }} } }, { secretRef: { name: {{ .Values.secretName }} } }]
          readinessProbe: { httpGet: { path: /health/ready, port: health }, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: health }, initialDelaySeconds: 20, periodSeconds: 15, timeoutSeconds: 5 }
          lifecycle: { preStop: { exec: { command: ["sh", "-c", "sleep 20"] } } }
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: amp-worker }
spec: { minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}, selector: { matchLabels: { app.kubernetes.io/name: amp-worker } } }
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: amp-worker }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amp-worker }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  behavior: { scaleDown: { stabilizationWindowSeconds: 600 }, scaleUp: { stabilizationWindowSeconds: 30, policies: [{ type: Percent, value: 100, periodSeconds: 60 }] } }
  metrics:
    - type: External
      external:
        metric: { name: bullmq_waiting_jobs, selector: { matchLabels: { queue: {{ .Values.autoscaling.queueName }} } } }
        target: { type: AverageValue, averageValue: {{ .Values.autoscaling.targetJobsPerPod | quote }} }
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: amp-worker }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: amp-worker } }
  policyTypes: [Ingress, Egress]
  ingress: [{ from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }], ports: [{ port: 3002 }] }]
  egress: [{ to: [{ namespaceSelector: {} }], ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }, { port: 443 }, { port: 27017 }, { port: 6379 }] }]
