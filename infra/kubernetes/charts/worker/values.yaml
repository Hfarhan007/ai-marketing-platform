image: { repository: ghcr.io/example/amp-worker, tag: latest, pullPolicy: IfNotPresent }
replicaCount: 2
resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: '1', memory: 1Gi } }
autoscaling:
  { enabled: true, minReplicas: 2, maxReplicas: 20, queueName: amp-jobs, targetJobsPerPod: 20 }
podDisruptionBudget: { minAvailable: 1 }
configMapName: amp-config
secretName: amp-runtime-secrets
serviceAccountName: amp-worker
