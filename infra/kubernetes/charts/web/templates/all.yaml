apiVersion: v1
kind: ServiceAccount
metadata: { name: {{ .Values.serviceAccountName }} }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: amp-web }
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: amp-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: amp-web } }
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      terminationGracePeriodSeconds: 20
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        - { name: nginx-cache, emptyDir: { sizeLimit: 64Mi } }
        - { name: nginx-run, emptyDir: { sizeLimit: 8Mi } }
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ name: http, containerPort: 8080 }]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 15, periodSeconds: 15 }
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata: { name: amp-web }
spec: { selector: { app.kubernetes.io/name: amp-web }, ports: [{ name: http, port: 80, targetPort: http }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: amp-web }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amp-web }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.cpuUtilization }} } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: amp-web }
spec: { minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}, selector: { matchLabels: { app.kubernetes.io/name: amp-web } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: amp-web, annotations: { cert-manager.io/cluster-issuer: letsencrypt-prod } }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{ hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tlsSecretName }} }]
  rules: [{ host: {{ .Values.ingress.host | quote }}, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: amp-web, port: { name: http } } } }] } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: amp-web }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: amp-web } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }], ports: [{ port: 8080 }] }]
